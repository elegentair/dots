#threshold = 20
backend = "kmeans" #full, resized, wal, thumb, fastresize, kmeans
color_space = "lchmixed" #lab, labmixed, lch, lchmixed, lchansi
pallete = "softdark16" #dark, dark16, darkcomp, darkcomp16, darkansi, harddark, harddark16, harddarkcomp, harddarkcomp16, light, light16, lightcomp, lightcomp16, softdark, softdark16, softdarkcomp, softdarkcomp16, softlight, softlight16, softlightcomp, softlightcomp16
check_contrast = true
[templates]
waybar = { src = "waybar-colors.css", dst = "~/.config/waybar/colors.css" }
hypr = { src = "hyprland-colors.conf", dst = "~/.config/hypr/colors.conf" }
zellij = { src = "zel-theme.kdl", dst = "~/.config/zellij/themes/wallust-zel.kdl" }
rofi = { src = "rofi.rasi", dst = "~/.config/rofi/theme.rasi" }
